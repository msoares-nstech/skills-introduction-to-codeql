name: "Release Security Gate"

# Gate PRÉ-TAG da virada de sprint. Rodado manualmente pelo release manager no momento de
# cortar a tag. Objetivo: SÓ liberar a release se a branch de referência não tiver alerta
# CodeQL aberto de severidade high/critical.
#
# Princípio: este workflow NÃO re-escaneia. O CodeQL (codeql.yml) já roda continuamente e
# mantém os alertas de Code Scanning atualizados; aqui apenas LEMOS esses resultados via API
# (job security-gate, ~segundos, ubuntu-latest). Se o gate passar, o job release-actions faz
# a virada e o job notify avisa o Teams.
#
# Em TODOS os caminhos a branch de origem (`ref`) deixa de existir após a tag:
#   - release NORMAL + rename: a `ref` é renomeada para a branch da próxima sprint;
#   - release NORMAL + new:     cria a branch da próxima sprint, move os PRs e DELETA a `ref`;
#   - HOTFIX:                    apenas DELETA a `ref` (hotfix não tem branch sucessora).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch de referência, base para a TAG (ex.: main, release/9.1/9.1.3.0)"
        required: true
        default: "main"
      tag:
        description: "Tag/release a ser criada (ex.: 9.1.3.0)"
        required: true
      release_type:
        description: "normal = virada de sprint (estabelece a próxima branch) | hotfix (só deleta a ref, sem sucessora)"
        type: choice
        required: true
        default: "normal"
        options:
          - normal
          - hotfix
      branch:
        description: "Nome da nova branch da próxima sprint. Obrigatório p/ release normal; ignorado no hotfix."
        required: false
        default: ""
      branch_action:
        description: "[só release normal] rename = renomeia a ref para a nova branch | new = cria a nova, move os PRs e deleta a ref"
        type: choice
        required: true
        default: "rename"
        options:
          - rename
          - new

# security-events:read -> ler alertas de Code Scanning | contents:write -> criar tag e branch
# pull-requests:write -> retargetar a base dos PRs abertos
permissions:
  security-events: read
  contents: write
  pull-requests: write

concurrency:
  group: release-gate-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  security-gate:
    name: "Security Gate (high/critical)"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF_INPUT: ${{ github.event.inputs.ref }}
    outputs:
      # SHA exato do tip validado pelo gate. release-actions tagueia ESSE commit, não um novo
      # tip que possa ter surgido enquanto o gate rodava (fecha TOCTOU entre avaliar e tagar).
      tip_sha: ${{ steps.gate.outputs.tip_sha }}
    steps:
      - name: Avaliar alertas CodeQL (freshness guard + política high/critical)
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          # Aceita "main" ou "refs/heads/main"
          REF_SHORT="${REF_INPUT#refs/heads/}"
          FULL_REF="refs/heads/${REF_SHORT}"
          echo "Ref avaliada: $FULL_REF"

          # Tip atual da branch de referência
          TIP_SHA=$(gh api "/repos/$REPO/commits/$REF_SHORT" --jq '.sha')
          echo "Tip SHA: $TIP_SHA"
          echo "tip_sha=$TIP_SHA" >> "$GITHUB_OUTPUT"

          # --- FRESHNESS GUARD ---
          # A última análise CodeQL da ref precisa ser exatamente o tip. Se o commit do tip ainda
          # não foi analisado (scan em andamento ou cancelado por concurrency no codeql.yml), um
          # "zero alertas" seria um FALSO-VERDE. Nesse caso, PARA e pede o scan.
          ANALYZED_SHA=$(gh api "/repos/$REPO/code-scanning/analyses?ref=$FULL_REF&tool_name=CodeQL&per_page=1" \
            --jq '.[0].commit_sha // ""' || echo "")
          if [ -z "$ANALYZED_SHA" ]; then
            echo "::error::Nenhuma análise CodeQL para $FULL_REF. Rode/aguarde o scan antes de liberar."
            {
              echo "## ❌ Release Security Gate — SEM ANÁLISE"
              echo "Não há análise CodeQL registrada para \`$FULL_REF\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$ANALYZED_SHA" != "$TIP_SHA" ]; then
            echo "::error::Análise desatualizada: analisado=$ANALYZED_SHA, tip=$TIP_SHA."
            {
              echo "## ❌ Release Security Gate — ANÁLISE DESATUALIZADA"
              echo "- Tip da ref: \`$TIP_SHA\`"
              echo "- Último commit analisado: \`$ANALYZED_SHA\`"
              echo ""
              echo "Aguarde o CodeQL do último push terminar e rode de novo."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # --- COLETA + POLÍTICA ---
          # Alertas OPEN do CodeQL nessa ref, agrupados por security_severity_level.
          ALERTS=$(gh api --paginate \
            "/repos/$REPO/code-scanning/alerts?state=open&ref=$FULL_REF&tool_name=CodeQL&per_page=100" \
            --jq '[.[] | {sev: (.rule.security_severity_level // "none"), name: .rule.id, url: .html_url}]' \
            | jq -s 'add // []')

          CRIT=$(echo "$ALERTS" | jq '[.[] | select(.sev=="critical")] | length')
          HIGH=$(echo "$ALERTS" | jq '[.[] | select(.sev=="high")]     | length')
          MED=$(echo "$ALERTS"  | jq '[.[] | select(.sev=="medium")]   | length')
          LOW=$(echo "$ALERTS"  | jq '[.[] | select(.sev=="low")]      | length')
          echo "Critical=$CRIT High=$HIGH Medium=$MED Low=$LOW"

          {
            echo "## Release Security Gate — \`$FULL_REF\` @ \`${TIP_SHA:0:8}\`"
            echo ""
            echo "| Severidade | Qtd | Bloqueia |"
            echo "|---|---|---|"
            echo "| Critical | $CRIT | ✅ |"
            echo "| High     | $HIGH | ✅ |"
            echo "| Medium   | $MED | — |"
            echo "| Low      | $LOW | — |"
          } >> "$GITHUB_STEP_SUMMARY"

          BLOCKING=$((CRIT + HIGH))
          if [ "$BLOCKING" -gt 0 ]; then
            {
              echo ""
              echo "### ❌ Bloqueado: $BLOCKING alerta(s) high/critical aberto(s)"
              echo "$ALERTS" | jq -r '.[] | select(.sev=="critical" or .sev=="high") | "- **\(.sev)** \(.name) — \(.url)"'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Gate bloqueado: $CRIT critical + $HIGH high abertos em $FULL_REF."
            exit 1
          fi

          echo "### ✅ Aprovado: nenhum alerta high/critical aberto" >> "$GITHUB_STEP_SUMMARY"

  release-actions:
    name: "Release actions (tag + branch)"
    runs-on: ubuntu-latest
    needs: security-gate
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF_INPUT: ${{ github.event.inputs.ref }}
      TAG: ${{ github.event.inputs.tag }}
      RELEASE_TYPE: ${{ github.event.inputs.release_type }}
      NEW_BRANCH: ${{ github.event.inputs.branch }}
      BRANCH_ACTION: ${{ github.event.inputs.branch_action }}
      TIP_SHA: ${{ needs.security-gate.outputs.tip_sha }}
    steps:
      - name: Criar tag anotada
        shell: bash
        run: |
          set -euo pipefail
          # Tag anotada apontando pro tip já validado pelo gate.
          TAG_OBJ=$(gh api --method POST "/repos/$REPO/git/tags" \
            -f tag="$TAG" -f message="release da $TAG" -f object="$TIP_SHA" -f type="commit" \
            --jq '.sha')
          gh api --method POST "/repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$TAG_OBJ"
          echo "## 🏷️ Tag \`$TAG\` criada em \`${TIP_SHA:0:8}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Destino da branch de origem
        # Em TODOS os caminhos a branch de origem (`ref`) deixa de existir após a tag. Como a origem
        # sempre some, os PRs abertos nela SEMPRE precisam ser tratados (retargetados p/ a nova branch,
        # ou fechados junto com a deleção no hotfix) - por isso não há mais input adjust_pr_base.
        shell: bash
        run: |
          set -euo pipefail
          REF_SHORT="${REF_INPUT#refs/heads/}"

          open_prs() {
            gh api --paginate "/repos/$REPO/pulls?state=open&base=$REF_SHORT&per_page=100" --jq '.[].number'
          }
          retarget_prs() {
            local target="$1" n moved=0
            while IFS= read -r n; do
              [ -z "$n" ] && continue
              gh api --method PATCH "/repos/$REPO/pulls/$n" -f base="$target" >/dev/null
              echo "- PR #$n: base \`$REF_SHORT\` → \`$target\`" >> "$GITHUB_STEP_SUMMARY"
              moved=$((moved+1))
            done < <(open_prs)
            [ "$moved" -eq 0 ] && echo "- Nenhum PR aberto com base \`$REF_SHORT\`." >> "$GITHUB_STEP_SUMMARY"
          }
          delete_origin() {
            gh api --method DELETE "/repos/$REPO/git/refs/heads/$REF_SHORT"
            echo "## 🗑️ Branch de origem \`$REF_SHORT\` deletada" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$RELEASE_TYPE" = "hotfix" ]; then
            # Hotfix não tem branch sucessora: não deve sobreviver à tag criada a partir dela.
            MSG=""
            while IFS= read -r n; do [ -n "$n" ] && MSG="$MSG #$n"; done < <(open_prs)
            if [ -n "$MSG" ]; then
              echo "::warning::Hotfix: PRs abertos com base em $REF_SHORT serão FECHADOS pela deleção:$MSG"
              echo "## ⚠️ PRs abertos serão fechados pela deleção da branch de hotfix:$MSG" >> "$GITHUB_STEP_SUMMARY"
            fi
            delete_origin
            exit 0
          fi

          # release_type = normal -> estabelece a branch da próxima sprint (a origem sempre some).
          if [ -z "$NEW_BRANCH" ]; then
            echo "::error::release normal exige o input 'branch' (nome da nova branch da próxima sprint)."
            exit 1
          fi

          if [ "$BRANCH_ACTION" = "rename" ]; then
            # rename nativo: renomeia a `ref` e o GitHub retargeta automaticamente os PRs + protections.
            gh api --method POST "/repos/$REPO/branches/$REF_SHORT/rename" -f new_name="$NEW_BRANCH"
            echo "## 🌿 Branch \`$REF_SHORT\` → \`$NEW_BRANCH\` (rename; PRs retargetados pelo GitHub)" >> "$GITHUB_STEP_SUMMARY"
          else
            # new: cria a nova branch do tip validado, MOVE os PRs abertos e então DELETA a origem.
            # O retarget acontece ANTES do delete para não orfanar/fechar PRs.
            gh api --method POST "/repos/$REPO/git/refs" -f ref="refs/heads/$NEW_BRANCH" -f sha="$TIP_SHA"
            echo "## 🌿 Branch \`$NEW_BRANCH\` criada a partir de \`$REF_SHORT\`" >> "$GITHUB_STEP_SUMMARY"
            echo "### 🔀 PRs retargetados" >> "$GITHUB_STEP_SUMMARY"
            retarget_prs "$NEW_BRANCH"
            delete_origin
          fi

  notify:
    name: "Notificar Teams"
    runs-on: ubuntu-latest
    # Depende dos dois jobs anteriores e roda SEMPRE (inclusive quando o gate bloqueia), para os
    # tech leads receberem o resumo em qualquer desfecho.
    needs: [security-gate, release-actions]
    if: always()
    env:
      # URL do webhook do canal (Teams -> Workflows / Power Automate "quando uma requisição HTTP
      # do Teams for recebida"). Guarde como secret do repositório.
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      GATE_RESULT: ${{ needs.security-gate.result }}
      ACTIONS_RESULT: ${{ needs.release-actions.result }}
      REF_INPUT: ${{ github.event.inputs.ref }}
      TAG: ${{ github.event.inputs.tag }}
      NEW_BRANCH: ${{ github.event.inputs.branch }}
      RELEASE_TYPE: ${{ github.event.inputs.release_type }}
    steps:
      - name: Enviar resumo ao Teams
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "::warning::TEAMS_WEBHOOK_URL não configurado — pulando notificação."
            exit 0
          fi

          # Determina o desfecho geral a partir do resultado dos jobs anteriores.
          if [ "$GATE_RESULT" != "success" ]; then
            STATUS="❌ Release NÃO liberada — gate não aprovado"
            COLOR="Attention"
            TAG_TXT="não criada (bloqueada pelo gate)"
            BRANCH_TXT="—"
          elif [ "$ACTIONS_RESULT" = "success" ]; then
            STATUS="✅ Release concluída com sucesso"
            COLOR="Good"
            TAG_TXT="$TAG"
            if [ "$RELEASE_TYPE" = "hotfix" ]; then
              BRANCH_TXT="— (hotfix: branch de origem deletada)"
            else
              BRANCH_TXT="$NEW_BRANCH"
            fi
          else
            STATUS="⚠️ Gate aprovou, mas as ações de release falharam"
            COLOR="Warning"
            TAG_TXT="verificar (ações de release: $ACTIONS_RESULT)"
            BRANCH_TXT="—"
          fi

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Monta um Adaptive Card (formato aceito pelo webhook Workflows/Power Automate do Teams).
          # jq com --arg garante escape correto de qualquer caractere nos valores.
          PAYLOAD=$(jq -n \
            --arg status "$STATUS" --arg color "$COLOR" \
            --arg repo "$GITHUB_REPOSITORY" --arg rtype "$RELEASE_TYPE" \
            --arg ref "$REF_INPUT" --arg tag "$TAG_TXT" --arg branch "$BRANCH_TXT" \
            --arg gate "$GATE_RESULT" --arg actions "$ACTIONS_RESULT" --arg url "$RUN_URL" '
            {
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: [
                    { type: "TextBlock", size: "Large", weight: "Bolder", text: "Release Security Gate" },
                    { type: "TextBlock", weight: "Bolder", color: $color, wrap: true, text: $status },
                    { type: "FactSet", facts: [
                      { title: "Repositório",     value: $repo },
                      { title: "Tipo",            value: $rtype },
                      { title: "Ref avaliada",    value: $ref },
                      { title: "Tag criada",      value: $tag },
                      { title: "Nova branch",     value: $branch },
                      { title: "Resultado gate",  value: $gate },
                      { title: "Resultado ações", value: $actions }
                    ]}
                  ],
                  actions: [
                    { type: "Action.OpenUrl", title: "Ver execução", url: $url }
                  ]
                }
              }]
            }')

          # -sS: silencioso mas mostra erro | --fail: status HTTP >=400 derruba o step (visibilidade).
          curl -sS --fail -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"
          echo "Notificação enviada ao Teams."
